name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync deps
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy strict
        continue-on-error: true
        run: |
          uv run mypy > mypy.txt 2>&1 || true
          python3 - <<'PY'
          t = open("mypy.txt").read()
          for i in range(0, min(len(t), 30000), 3000):
              print("::error title=mypy::" + t[i:i+3000].replace("%", "%25").replace("\n", "%0A"))
          PY

      - name: Pytest (skip live)
        run: |
          uv run pytest -q -m "not live" --tb=short > pytest.txt 2>&1 || true
          python3 - <<'PY'
          t = open("pytest.txt").read()
          t = t[-27000:]
          for i in range(0, len(t), 3000):
              print("::error title=pytest::" + t[i:i+3000].replace("%", "%25").replace("\n", "%0A"))
          PY
